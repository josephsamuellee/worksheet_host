# SQLite. Versions 3.8.0 and up are supported.
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH") {
    File.join(ENV.fetch("WORKSHEET_HOST_DATA_ROOT", "/mnt/raid1/data/worksheet_host"), "db", "production.sqlite3")
  } %>
